name: Build desktop clients

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
            artifact: Seafile-macos-universal
            package_path: Seafile-*-macos-universal.dmg
          - name: Windows x64
            os: windows-latest
            artifact: Seafile-windows-x64
            package_path: dist/*
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Install NuGet
        if: runner.os == 'Windows'
        run: choco install nuget.commandline -y --no-progress

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          fi
          BUILD="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f2)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build macOS
        if: runner.os == 'macOS'
        run: flutter build macos --release --build-name=${{ steps.version.outputs.version }} --build-number=${{ steps.version.outputs.build }}

      - name: Verify macOS architecture
        if: runner.os == 'macOS'
        run: |
          BIN="build/macos/Build/Products/Release/Seafile.app/Contents/MacOS/Seafile"
          lipo -info "$BIN"
          lipo -info "$BIN" | grep -q "x86_64"
          lipo -info "$BIN" | grep -q "arm64"

      - name: Package macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          APP="build/macos/Build/Products/Release/Seafile.app"
          STAGE="$RUNNER_TEMP/seafile-dmg"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          ditto "$APP" "$STAGE/Seafile.app"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Seafile $VERSION" -srcfolder "$STAGE" -ov -format UDZO "Seafile-$VERSION-macos-universal.dmg"
          ls -lh "Seafile-$VERSION-macos-universal.dmg"

      - name: Build Windows
        if: runner.os == 'Windows'
        run: flutter build windows --release --build-name=${{ steps.version.outputs.version }} --build-number=${{ steps.version.outputs.build }}

      - name: Package Windows installer and portable zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $releaseDir = (Resolve-Path "build\windows\x64\runner\Release").Path
          $dist = Join-Path $PWD "dist"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          Compress-Archive -Path (Join-Path $releaseDir "*") -DestinationPath (Join-Path $dist "Seafile-$version-windows-x64.zip") -Force

          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            $iscc = Get-ChildItem "C:\Program Files\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $iscc) { throw "Inno Setup ISCC.exe was not found" }
          & $iscc.FullName "/DMyAppVersion=$version" "/DMyAppArch=x64" "/DSourceDir=$releaseDir" "/DOutputDir=$dist" "packaging\windows\seafile.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

          Get-ChildItem $dist | Format-Table Name, Length

      - name: Upload packaged client
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.package_path }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release assets and notes
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release-assets
          find artifacts -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.zip' \) -exec cp {} release-assets/ \;
          ls -lh release-assets
          cat > release-notes.md <<EOF
          ## Seafile Desktop ${GITHUB_REF_NAME}

          | Platform | Architecture | Package |
          | --- | --- | --- |
          | macOS | Universal (arm64 + x64) | \`Seafile-${VERSION}-macos-universal.dmg\` |
          | Windows | x64 | \`Seafile-${VERSION}-windows-x64-setup.exe\` (installer) |
          | Windows | x64 | \`Seafile-${VERSION}-windows-x64.zip\` (portable) |

          **Full Changelog**: https://github.com/${{ github.repository }}/commits/${GITHUB_REF_NAME}
          EOF

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: Seafile Desktop ${{ github.ref_name }}
          body_path: release-notes.md
          files: release-assets/*
